[supervisord]
nodaemon=true
user=root
# 将主日志输出到外部映射路径防止丢失
logfile=/config/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cron]
# 前台不停止运行定时任务服务器进程，确保定时流转正常运作
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:server]
# 统一入口：ESP32 拉取接口 + 照片库 + 相册管理 + 版式编辑器 + 选片推送（原 8766 webui 已并入）
command=python -u server.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/config/logs/server.log
stderr_logfile=/config/logs/server.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
