[supervisord]
nodaemon=true
user=root
# 将主日志输出到外部映射路径防止丢失
logfile=/config/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cron]
# 前台不停止运行定时任务服务器进程，确保定时流转正常运作
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webui]
# 以不带缓冲区模式运行 Python Web 管理界面 (由于 config.py 默认设置端口往往在 8766)
command=python -u webui.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/config/logs/webui.log
stderr_logfile=/config/logs/webui.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
