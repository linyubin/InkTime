<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkTime 样式编辑器</title>
<style>
  @font-face { font-family: "SmileySans"; src: url("/style-assets/font/SmileySans-Oblique.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "LXGW"; src: url("/style-assets/font/LXGWHeartSerifMN.ttf") format("truetype"); font-display: block; }

  :root {
    --bg: #171512; --panel: #201d19; --panel2: #282420; --line: #3a352e;
    --text: #e8e2d6; --dim: #9a9184; --accent: #dcb400; --red: #c80000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; }

  /* ── 顶栏 ── */
  #toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
             background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #toolbar .logo { font-weight: 700; letter-spacing: 1px; margin-right: 6px; }
  #toolbar .logo b { color: var(--accent); }
  #styleBadge { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
                padding: 2px 10px; font-family: Consolas, monospace; }
  #styleBadge.dirty::after { content: " ●未保存"; color: var(--accent); }
  .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #211d18; font-weight: 700; border: none; }
  button.danger:hover { border-color: var(--red); color: #ff9d9d; }
  button:disabled { opacity: .4; cursor: default; }
  label.chk { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); cursor: pointer; }
  select, input[type=text], input[type=number], input[type=date], textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font-size: 13px; max-width: 100%;
  }
  input[type=color] { width: 34px; height: 26px; padding: 1px; background: none; border: 1px solid var(--line); border-radius: 6px; }
  textarea { width: 100%; resize: vertical; }

  /* ── 三栏 ── */
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 265px; background: var(--panel); overflow-y: auto; padding: 10px; }
  #right { width: 305px; }
  aside section { margin-bottom: 14px; }
  aside h3 { font-size: 12.5px; color: var(--dim); font-weight: 600; margin: 4px 0 8px;
             text-transform: uppercase; letter-spacing: .5px; }
  .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }

  #styleList { list-style: none; margin: 0; padding: 0; max-height: 200px; overflow-y: auto; }
  #styleList li { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 6px;
                  cursor: pointer; font-family: Consolas, monospace; font-size: 12.5px; }
  #styleList li:hover { background: var(--panel2); }
  #styleList li.current { background: var(--panel2); outline: 1px solid var(--accent); }
  #styleList li .nm { font-family: inherit; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #styleList li .tag { color: var(--dim); font-size: 11px; }

  #presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #presets .preset { text-align: center; padding: 8px 4px; border: 1px dashed var(--line);
                     border-radius: 8px; cursor: grab; user-select: none; background: var(--panel2); }
  #presets .preset:hover { border-color: var(--accent); }
  #presets .preset .ic { font-size: 17px; display: block; }

  #center { flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#141210 0% 25%, #1a1714 0% 50%) 50% / 28px 28px;
            min-width: 0; position: relative; }
  #cvWrap { position: relative; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
  #cv { display: block; max-height: calc(100vh - 140px); max-width: 100%; cursor: default; }
  /* 画布下信息条：选中元素的几何/溢出提示 + 操作提示——都不再叠加在照片上 */
  #canvasHud { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
               width: min(100%, var(--hudw, 480px)); margin-top: 6px; font-size: 12px;
               color: var(--dim); background: rgba(0,0,0,.55); border-radius: 8px;
               padding: 4px 12px; }
  #selInfo { color: #ffe08a; font-family: Consolas, monospace; }
  #selInfo .ov { color: #ff9d9d; }

  /* ── 元素层级 ── */
  #layers { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; }
  #layers li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px;
               cursor: grab; font-size: 12.5px; }
  #layers li:hover { background: var(--panel2); }
  #layers li.sel { background: var(--panel2); outline: 1px solid var(--accent); }
  #layers li .kd { color: var(--dim); font-size: 11px; font-family: Consolas, monospace; }
  #layers li .del { margin-left: auto; color: var(--dim); cursor: pointer; }
  #layers li .del:hover { color: #ff9d9d; }

  /* ── 属性表单 ── */
  .frm { display: grid; grid-template-columns: 78px 1fr; gap: 5px 8px; align-items: center; }
  .frm label { color: var(--dim); font-size: 12px; }
  .frm .full { grid-column: 1 / -1; }
  .quicklen button { padding: 2px 8px; font-size: 12px; }
  #props .empty { color: var(--dim); }
  .klabel { font-size: 11px; color: var(--accent); margin: 8px 0 4px; font-family: Consolas, monospace; }

  /* ── 弹层 ── */
  #modalBack { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
               align-items: center; justify-content: center; z-index: 50; }
  #modalBack[hidden] { display: none; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 16px 18px; max-width: 92vw; max-height: 88vh; overflow: auto; }
  .modal h2 { margin: 0 0 12px; font-size: 15px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .diffbox { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap;
             max-height: 46vh; overflow: auto; background: var(--bg); border-radius: 8px;
             padding: 10px; min-width: 420px; }
  .diff-add { color: #7ec97e; background: rgba(126,201,126,.08); display: block; }
  .diff-del { color: #ff9d9d; background: rgba(255,157,157,.07); display: block; text-decoration: line-through; }
  .diff-ctx { display: block; color: var(--dim); }
  #gtWrap { position: relative; display: inline-block; line-height: 0; }
  #gtWrap img { max-height: 64vh; max-width: 80vw; }
  #gtTop { position: absolute; inset: 0; }
  #gtSlider { width: 100%; margin-top: 10px; }
  .modal .tips { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<header id="toolbar">
  <span class="logo">🖋 InkTime <b>样式编辑器</b> <a href="/" style="font-size:11px;font-weight:400;color:#8ab4ff;text-decoration:none;margin-left:6px;">← 首页</a></span>
  <span id="styleBadge">未加载</span>
  <button id="btnUndo" title="Ctrl+Z">↩ 撤销</button>
  <button id="btnRedo" title="Ctrl+Shift+Z">↪ 重做</button>
  <label class="chk"><input type="checkbox" id="tgEink"> 墨水屏模式</label>
  <label class="chk"><input type="checkbox" id="tgGuide" checked> 相框警戒线</label>
  <button id="btnGuideCfg" title="警戒线显示设置（范围/圆角/遮罩）">⚙</button>
  <button id="btnFrameState" title="载入当前相框正在显示的照片与版式">🖼 载入相框状态</button>
  <button id="btnGroundTruth">🔬 真机对照</button>
  <span class="spacer"></span>
  <select id="photoSel" title="压力测试照片"></select>
  <button id="btnUpload" title="换入任意本地照片">📷 换照片</button>
  <input type="file" id="photoUp" accept="image/*" hidden>
  <button id="btnSave" class="primary">💾 保存</button>
</header>

<main>
  <aside id="left">
    <section>
      <h3>版式库</h3>
      <div class="row">
        <select id="oriFilter">
          <option value="all">全部朝向</option>
          <option value="portrait">竖屏 P 系</option>
          <option value="landscape">横屏 L 系</option>
        </select>
      </div>
      <ul id="styleList"></ul>
      <div class="row">
        <button id="btnNew">新建…</button>
        <button id="btnDup" title="以当前版式为底稿复制为新样式">另存新版式</button>
        <button id="btnDel" class="danger">删除</button>
      </div>
    </section>
    <section>
      <h3>元素库 · 拖入画布（或点击添加）</h3>
      <div id="presets"></div>
    </section>
  </aside>

  <section id="center">
    <div id="cvWrap">
      <canvas id="cv"></canvas>
    </div>
    <div id="canvasHud">
      <span id="selInfo">未选中元素</span>
      <span>拖动移动 · 右下角缩放 · 方向键微调(Shift×10) · Del 删除 · Ctrl+D 复制</span>
    </div>
  </section>

  <aside id="right">
    <section>
      <h3>槽位文案（压测排版）</h3>
      <div class="frm">
        <label>旁白 side</label><textarea id="itSide" rows="2"></textarea>
        <label>日期 date</label><input type="date" id="itDate">
        <label>城市 city</label><input type="text" id="itCity" placeholder="留空则钤印不画">
      </div>
      <div class="row quicklen">
        <span style="flex:0 auto; color:var(--dim); font-size:12px; align-self:center;">旁白压测:</span>
        <button data-len="empty">空</button>
        <button data-len="short">短(4字)</button>
        <button data-len="mid">中(12字)</button>
        <button data-len="long">长(30字)</button>
      </div>
    </section>
    <section>
      <h3>版式属性</h3>
      <div class="frm" id="styleProps"></div>
    </section>
    <section>
      <h3>元素层级（上=顶层，可拖拽排序）</h3>
      <ol id="layers"></ol>
    </section>
    <section>
      <h3>元素属性</h3>
      <p id="ovWarn" hidden style="color:#ff9d9d;margin:0 0 6px;font-size:12.5px;"></p>
      <div id="props"><p class="empty">在画布或层级列表选中元素</p></div>
    </section>
  </aside>
</main>

<div id="modalBack" hidden><div class="modal" id="modalBox"></div></div>

<script src="/static/style_editor/renderer.js?v=20260925h"></script>
<script src="/static/style_editor/editor.js?v=20260925h"></script>
</body>
</html>
